<script>

const threeScript=document.createElement("script");

threeScript.src=

threeScript.onload=startGame;

threeScript.onerror=()=>{
 document.getElementById("status").innerText=
 "3D motoru yüklenemedi. İnternet bağlantısını kontrol et.";

document.head.appendChild(threeScript);


/* =====================================================

===================================================== */

let scene,camera,renderer;
let player,enemy;
let mode="lobby";

let px=0,pz=0,yaw=0;
let joyX=0,joyY=0;

let money=0;
let leaves=0;
let wins=0;
let losses=0;

let maxHP=20;

let playerColor=0xff7895;

let enemyWood=5;

let enemyUnits=[];
let projectiles=[];

let lastMyWood=0;
let lastEnemyWood=0;

let finishing=false;

let owned=["mushroom"];

let found={

};

let boughtColors={};

let enemyLevel=0;


/* =====================================================

const CARDS={

 mushroom:{

 },

 },

  speed:.085
 }

};


/* =====================================================
   RENKLER
===================================================== */

const COLORS=[
 {name:"Mavi",color:0x4287f5,price:5},
 {name:"Sarı",color:0xffd21f,price:10},
 {name:"Yeşil",color:0x35b85a,price:15},
 {name:"Mor",color:0x8b4de8,price:20},
 {name:"Kırmızı",color:0xe83d3d,price:25}
];


/* =====================================================
   START
===================================================== */

function startGame(){

 scene=new THREE.Scene();

 scene.background=new THREE.Color(0x70c7e8);

 scene.fog=new THREE.Fog(
  0x70c7e8,
  50,
  220
 );

 camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  500
 );

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
 );

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 document.body.appendChild(renderer.domElement);

 lights();
 createLobby();
 createPlayer();
 controls();
 updateStats();

 document.getElementById("status").style.display="none";

 animate();
}


/* =====================================================
   IŞIK
===================================================== */

function lights(){

 scene.add(
  new THREE.HemisphereLight(
   0xffffff,
   0x466b3c,
   2
  )
 );

 const sun=new THREE.DirectionalLight(
  0xffffff,
  2
 );

 sun.position.set(30,70,30);

 scene.add(sun);
}


/* =====================================================
   MATERIAL
===================================================== */

function mat(color){
 return new THREE.MeshStandardMaterial({
  color:color,
  roughness:.8
 });
}


/* =====================================================
   BEYİN
===================================================== */

function createBrain(color){

 const g=new THREE.Group();

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.78,24,20),
  mat(color)
 );

 head.scale.set(1.08,1.02,1);
 head.position.y=1.75;

 g.add(head);

 const black=mat(0x222222);

 const eye1=new THREE.Mesh(
  new THREE.SphereGeometry(.075,10,8),
  black
 );

 const eye2=eye1.clone();

 eye1.position.set(-.27,1.88,.72);
 eye2.position.set(.27,1.88,.72);

 g.add(eye1,eye2);

 const smile=new THREE.Mesh(
  new THREE.TorusGeometry(
   .25,.045,8,18,Math.PI
  ),
  black
 );

 smile.position.set(0,1.61,.73);
 smile.rotation.x=Math.PI;

 g.add(smile);

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.75,.85,.5),
  mat(color)
 );

 body.position.y=.95;

 g.add(body);

 const skin=mat(0xffc0a4);

 const leftArm=new THREE.Mesh(
  new THREE.CylinderGeometry(.09,.11,.9,10),
  skin
 );

 const rightArm=leftArm.clone();

 leftArm.position.set(-.58,1.05,0);
 rightArm.position.set(.58,1.05,0);

 leftArm.rotation.z=-.65;
 rightArm.rotation.z=.65;

 g.add(leftArm,rightArm);

 const leftLeg=new THREE.Mesh(
  new THREE.CylinderGeometry(.11,.13,.8,10),
  skin
 );

 const rightLeg=leftLeg.clone();

 leftLeg.position.set(-.22,.35,0);
 rightLeg.position.set(.22,.35,0);

 g.add(leftLeg,rightLeg);

 g.userData={
  head,
  body,
  leftArm,
  rightArm,
  leftLeg,
  rightLeg
 };

 return g;
}


/* =====================================================
   RENK UYGULA
===================================================== */

function applyPlayerColor(color){

 playerColor=color;

 if(!player)return;

 player.userData.head.material.color.setHex(color);
 player.userData.body.material.color.setHex(color);
}


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(){

 player=createBrain(playerColor);
 scene.add(player);
}


/* =====================================================
   GROUND
===================================================== */

function createGround(){

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(300,300),
  mat(0x4e9947)
 );

 ground.rotation.x=-Math.PI/2;

 scene.add(ground);
}


/* =====================================================
   TREE
===================================================== */

function tree(x,z,scale=1){

 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.35,3,8),
  mat(0x704523)
 );

 trunk.position.y=1.5;

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(2.1,12,10),
  mat(0x26743a)
 );

 crown.position.y=4;

 g.add(trunk,crown);

 g.position.set(x,0,z);
 g.scale.setScalar(scale);

 scene.add(g);

 return g;
}


/* =====================================================
   BUSH
===================================================== */

function bush(x,z){

 const g=new THREE.Group();

 for(let i=0;i<7;i++){

  const b=new THREE.Mesh(
   new THREE.SphereGeometry(
    .5+Math.random()*.3,
    10,
    8
   ),
   mat(0x23662e)
  );

  b.position.set(
   (Math.random()-.5)*1.7,
   .5+Math.random()*.4,
   (Math.random()-.5)*1.7
  );

  g.add(b);
 }

 g.position.set(x,0,z);

 scene.add(g);

 return g;
}


/* =====================================================
   PLANT
===================================================== */

function createPlant(id){

 const g=new THREE.Group();

 if(id==="mushroom"){

  const stem=new THREE.Mesh(
   new THREE.CylinderGeometry(.22,.3,.8,12),
   mat(0xf0d2a0)
  );

  stem.position.y=.4;

  const cap=new THREE.Mesh(
   new THREE.SphereGeometry(.6,16,10),
   mat(0xd83c32)
  );

  cap.scale.y=.55;
  cap.position.y=.95;

  g.add(stem,cap);
 }

 if(id==="rose"){

  const stem=new THREE.Mesh(
   new THREE.CylinderGeometry(.06,.08,1.4,8),
   mat(0x24813a)
  );

  stem.position.y=.7;

  const flower=new THREE.Mesh(
   new THREE.SphereGeometry(.42,14,10),
   mat(0xe62f52)
  );

  flower.position.y=1.45;

  g.add(stem,flower);
 }

 if(id==="tulip"){

  const stem=new THREE.Mesh(
   new THREE.CylinderGeometry(.055,.07,1.5,8),
   mat(0x24813a)
  );

  stem.position.y=.75;

  const flower=new THREE.Mesh(
   new THREE.ConeGeometry(.43,.8,6),
   mat(0xef526b)
  );

  flower.position.y=1.55;

  g.add(stem,flower);
 }

 if(id==="daisy"){

  const stem=new THREE.Mesh(
   new THREE.CylinderGeometry(.05,.07,1.3,8),
   mat(0x24813a)
  );

  stem.position.y=.65;

  g.add(stem);

  const center=new THREE.Mesh(
   new THREE.SphereGeometry(.18,10,8),
   mat(0xffd21f)
  );

  center.position.y=1.4;

  g.add(center);

  for(let i=0;i<8;i++){

   const petal=new THREE.Mesh(
    new THREE.SphereGeometry(.16,8,8),
    mat(0xffffff)
   );

   const a=i*Math.PI/4;

   petal.position.set(
    Math.cos(a)*.28,
    1.4,
    Math.sin(a)*.28
   );

   g.add(petal);
  }
 }

 if(id==="cactus"){

  const body=new THREE.Mesh(
   new THREE.CylinderGeometry(.32,.4,1.5,10),
   mat(0x31a94d)
  );

  body.position.y=.75;

  g.add(body);

  const arm1=new THREE.Mesh(
   new THREE.CylinderGeometry(.13,.16,.65,8),
   mat(0x31a94d)
  );

  arm1.position.set(.4,.85,0);
  arm1.rotation.z=-Math.PI/2;

  g.add(arm1);

  const arm2=arm1.clone();

  arm2.position.set(-.4,.65,0);
  arm2.rotation.z=Math.PI/2;

  g.add(arm2);
 }

 if(id==="clover"){

  const stem=new THREE.Mesh(
   new THREE.CylinderGeometry(.05,.07,1,8),
   mat(0x25843c)
  );

  stem.position.y=.5;

  g.add(stem);

  for(let i=0;i<4;i++){

   const leaf=new THREE.Mesh(
    new THREE.SphereGeometry(.25,12,10),
    mat(0x2dbb52)
   );

   const a=i*Math.PI/2;

   leaf.position.set(
    Math.cos(a)*.25,
    1.05,
    Math.sin(a)*.25
   );

   leaf.scale.y=.8;

   g.add(leaf);
  }
 }

 if(id==="palm"){

  const trunk=new THREE.Mesh(
   new THREE.CylinderGeometry(.16,.25,2.2,10),
   mat(0x80542c)
  );

  trunk.position.y=1.1;

  g.add(trunk);

  for(let i=0;i<7;i++){

   const leaf=new THREE.Mesh(
    new THREE.BoxGeometry(.12,.08,1.7),
    mat(0x23853d)
   );

   const a=i*Math.PI*2/7;

   leaf.position.set(
    Math.cos(a)*.7,
    2.25,
    Math.sin(a)*.7
   );

   leaf.rotation.y=a;

   g.add(leaf);
  }
 }

 if(id==="pea"){

  const stem=new THREE.Mesh(
   new THREE.CylinderGeometry(.06,.08,1.4,8),
   mat(0x23843d)
  );

  stem.position.y=.7;

  g.add(stem);

  const pod=new THREE.Mesh(
   new THREE.SphereGeometry(.45,14,10),
   mat(0x4dbb42)
  );

  pod.scale.set(.75,.45,1);
  pod.position.y=1.35;

  g.add(pod);
 }

 if(id==="cress"){

  for(let i=0;i<6;i++){

   const leaf=new THREE.Mesh(
    new THREE.SphereGeometry(.2,10,8),
    mat(0x2f9b45)
   );

   leaf.position.set(
    (Math.random()-.5)*.8,
    .3+Math.random()*.9,
    (Math.random()-.5)*.8
   );

   leaf.scale.y=1.7;

   g.add(leaf);
  }
 }

 return g;
}


/* =====================================================
   HIDDEN CARD
===================================================== */

function hiddenCard(id,x,z){

 const g=new THREE.Group();

 const cover=new THREE.Mesh(
  new THREE.SphereGeometry(1.25,12,10),
  mat(0x205a29)
 );

 cover.position.y=1;

 const plant=createPlant(id);

 plant.position.y=.25;
 plant.scale.setScalar(.8);

 g.add(cover,plant);

 g.position.set(x,0,z);

 g.userData.cardId=id;

 scene.add(g);
}


/* =====================================================
   LOBBY
===================================================== */

function createLobby(){

 createGround();

 tree(-15,-5,1.2);
 tree(14,-12,1);
 tree(-19,-23,1.4);
 tree(18,-30,1.2);
 tree(-10,-35,1);
 tree(10,-44,1.3);
 tree(-25,-50,1.5);
 tree(25,-55,1.2);

 bush(-16,-9);
 hiddenCard("rose",-16,-9);

 bush(4,-35);
 hiddenCard("daisy",4,-35);

 bush(18,-27);
 hiddenCard("tulip",18,-27);

 tree(-8,-65,1.5);
 hiddenCard("cactus",-8,-66);

 const clover=createPlant("clover");

 clover.position.set(30,0,-38);
 clover.rotation.y=Math.PI;
 clover.userData.cardId="clover";

 scene.add(clover);

 bush(23,-57);
 hiddenCard("palm",23,-57);

 tree(-30,-30,1.2);
 hiddenCard("pea",-30,-31);

 const cress=createPlant("cress");

 cress.position.set(0,0,5);
 cress.rotation.y=Math.PI;
 cress.userData.cardId="cress";

 scene.add(cress);

 const gate=new THREE.Group();
 const gateMat=mat(0x57351e);

 const a=new THREE.Mesh(
  new THREE.BoxGeometry(1,4,1),
  gateMat
 );

 a.position.x=-3;

 const b=a.clone();
 b.position.x=3;

 const top=new THREE.Mesh(
  new THREE.BoxGeometry(7,1,1),
  gateMat
 );

 top.position.y=4;

 gate.add(a,b,top);

 gate.position.z=-15;

 scene.add(gate);
}


/* =====================================================
   CLEAR
===================================================== */

function clearScene(){

 while(scene.children.length)
  scene.remove(scene.children[0]);

 projectiles=[];

 lights();
}


/* =====================================================
   BRIDGE
===================================================== */

function bridge(x){

 const b=new THREE.Mesh(
  new THREE.BoxGeometry(7,.35,9),
  mat(0x80542c)
 );

 b.position.set(x,.25,0);

 scene.add(b);
}


/* =====================================================
   BATTLE
===================================================== */

function createBattle(){

 clearScene();

 const floor=new THREE.Mesh(
  new THREE.BoxGeometry(48,.4,58),
  mat(0x8d6c49)
 );

 floor.position.y=-.2;

 scene.add(floor);

 const own=new THREE.Mesh(
  new THREE.BoxGeometry(48,.08,25),
  mat(0x4d914f)
 );

 own.position.set(0,.02,15);

 scene.add(own);

 const opp=new THREE.Mesh(
  new THREE.BoxGeometry(48,.08,25),
  mat(0x984e4e)
 );

 opp.position.set(0,.03,-15);

 scene.add(opp);

 const river=new THREE.Mesh(
  new THREE.BoxGeometry(48,.12,8),
  mat(0x258bca)
 );

 river.position.y=.1;

 scene.add(river);

 bridge(-13);
 bridge(13);

 player=createBrain(playerColor);

 player.position.set(0,0,23);

 scene.add(player);

 enemy=createBrain(0x6e96ff);

 enemy.position.set(0,0,-23);
 enemy.rotation.y=Math.PI;

 scene.add(enemy);

 camera.position.set(0,27,37);
 camera.lookAt(0,0,0);
}


/* =====================================================
   BATTLE BAŞLAT
===================================================== */

function beginBattle(){

 if(deck.length!==3){

  msg("🔒 Savaşmak için 3 kart seçmelisin!");

  return;
 }

 mode="battle";

 myWood=5;
 enemyWood=5;

 myHP=maxHP;
 enemyHP=maxHP;

 myUnits=[];
 enemyUnits=[];
 projectiles=[];

 finishing=false;

 lastMyWood=performance.now();
 lastEnemyWood=performance.now();
 lastBot=performance.now();

 createBattle();

 document.getElementById("battleUI").style.display="block";

/* =====================================================
   UNIT MODEL
===================================================== */

function createUnitModel(id,team){

 const data=CARDS[id];

 const g=createPlant(id);

 const teamColor=
  team==="blue"
   ?0x3988ff
   :0xe33a3a;

 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(.42,.48,.12,12),
  mat(teamColor)
 );

 base.position.y=.08;

 g.add(base);

 const skin=mat(0xffc0a4);

 const leftArm=new THREE.Mesh(
  new THREE.CylinderGeometry(.055,.07,.65,8),
  skin
 );

 const rightArm=leftArm.clone();

 leftArm.position.set(-.48,.85,0);
 rightArm.position.set(.48,.85,0);

 leftArm.rotation.z=-.7;
 rightArm.rotation.z=.7;

 g.add(leftArm,rightArm);

 const leftLeg=new THREE.Mesh(
  new THREE.CylinderGeometry(.07,.08,.6,8),
  skin
 );

 const rightLeg=leftLeg.clone();

 leftLeg.position.set(-.17,.22,0);
 rightLeg.position.set(.17,.22,0);

 g.add(leftLeg,rightLeg);

 const black=mat(0x222222);

 const eye1=new THREE.Mesh(
  new THREE.SphereGeometry(.055,8,8),
  black
 );

 const eye2=eye1.clone();

 eye1.position.set(-.14,1.36,.43);
 eye2.position.set(.14,1.36,.43);

 g.add(eye1,eye2);

 g.userData={
  leftArm,
  rightArm,
  leftLeg,
  rightLeg
 };

 g.scale.setScalar(.9);

 return g;
}


/* =====================================================
   SPAWN
===================================================== */

function spawnUnit(id,team){

 const data=CARDS[id];

 const unit=createUnitModel(id,team);

 if(id==="palm"){

  if(team==="blue"){

   unit.position.set(
    player.position.x,
    0,
    player.position.z-3
   );

  }else{

   unit.position.set(
    enemy.position.x,
    0,
    enemy.position.z+3
   );

   unit.rotation.y=Math.PI;
  }

 }else if(team==="blue"){

  unit.position.set(
   (Math.random()-.5)*14,
   0,
   13+Math.random()*5
  );

 }else{

  unit.position.set(
   (Math.random()-.5)*14,
   0,
   -13-Math.random()*5
  );

  unit.rotation.y=Math.PI;
 }

 scene.add(unit);

 const obj={
  id:id,
  team:team,
  mesh:unit,
  hp:data.hp,
  last:performance.now()
 };

 if(team==="blue")
  myUnits.push(obj);
 else
  enemyUnits.push(obj);

 return obj;
}

/* =====================================================
   RAKİP BOT
===================================================== */

function bot(now){

 /*
  Rakip daha hızlı odun topluyor.
  Ayrıca her galibiyette güçleniyor.
 */

 const interval=
  Math.max(
   1500,
   3500-enemyLevel*250
  );

 if(now-lastBot<interval)
  return;

 lastBot=now;

 const choices=
  owned.filter(id=>
   CARDS[id] &&
   CARDS[id].wood<=enemyWood
  );

 if(!choices.length)
  return;

 const id=
  choices[
   Math.floor(
    Math.random()*choices.length
   )
  ];

 enemyWood-=CARDS[id].wood;

 spawnUnit(id,"red");
}


/* =====================================================
   ANİMASYON
===================================================== */

function animateUnit(mesh,time){

 const a=Math.sin(time*.008)*.45;

 const u=mesh.userData;

 if(!u)return;

 u.leftLeg.rotation.x=a;
 u.rightLeg.rotation.x=-a;

 u.leftArm.rotation.x=-a;
 u.rightArm.rotation.x=a;
}


/* =====================================================
   YAKIN HEDEF
===================================================== */

function nearestUnit(unit,enemies){

 let best=null;
 let dist=Infinity;

 for(const e of enemies){

  if(e.hp<=0)continue;

  const d=
   unit.mesh.position.distanceTo(
    e.mesh.position
   );

  if(d<dist){

   dist=d;
   best=e;
  }
 }

 return best;
}


/* =====================================================
   BEYİN HASARI
===================================================== */

function damageBrain(team,damage){

 if(damage<=0)return;

 if(team==="blue"){

  enemyHP=Math.max(
   0,
   enemyHP-damage
  );

 }else{

  myHP=Math.max(
   0,
   myHP-damage
  );
 }
}


/* =====================================================
   UNIT HASARI
===================================================== */

function damageUnit(target,damage){

 if(!target)return;

 if(target.hp<=0)return;

 target.hp=Math.max(
  0,
  target.hp-damage
 );
}

/* =====================================================
   BEYİN MERMİSİ
===================================================== */

function createBrainProjectile(
 from,
 team,
 damage
){

 const brain=
  team==="blue"
   ?enemy
   :player;

 const g=new THREE.Group();

 const pea=new THREE.Mesh(
  new THREE.SphereGeometry(.18,10,8),
  mat(0x55d33f)
 );

 g.add(pea);

 g.position.copy(from.mesh.position);
 g.position.y+=1;

 scene.add(g);

  target:null,
  brain:brain,

  speed:.22,
  brainTarget:true
 });

/* =====================================================
   MERMİ UPDATE
===================================================== */

function updateProjectiles(){

 projectiles=projectiles.filter(p=>{

  if(p.brainTarget){

   if(
    (p.team==="blue"&&enemyHP<=0)||
    (p.team==="red"&&myHP<=0)
   ){

    scene.remove(p.mesh);

    return false;
   }

   const targetPos=p.brain.position.clone();

   targetPos.y+=1.2;

   const dir=new THREE.Vector3()
    .subVectors(
     targetPos,
     p.mesh.position
    );

   const d=dir.length();

   if(d<.7){

    damageBrain(
     p.team,
     p.damage
    );

    scene.remove(p.mesh);

    return false;
   }

   dir.normalize();

   p.mesh.position.addScaledVector(
    dir,
    p.speed
   );

   return true;
  }

  if(!p.target||p.target.hp<=0){

   scene.remove(p.mesh);

   return false;
  }

  const targetPos=
   p.target.mesh.position.clone();

  targetPos.y+=.7;

  const dir=new THREE.Vector3()
   .subVectors(
    targetPos,
    p.mesh.position
   );

  const d=dir.length();

  if(d<.5){

   damageUnit(
    p.target,
    p.damage
   );

   scene.remove(p.mesh);

   return false;
  }

  dir.normalize();

  p.mesh.position.addScaledVector(
   dir,
   p.speed
  );

  return true;
 });
}


/* =====================================================
   ARMY
===================================================== */

function armyUpdate(
 now,
 army,
 enemies,
 brain,
 team
){

 for(const u of army){

  if(u.hp<=0)continue;

  const c=CARDS[u.id];

  if(!c)continue;

  if(c.stationary)continue;

  const target=nearestUnit(
   u,
   enemies
  );

  if(target){

   const dir=new THREE.Vector3()
    .subVectors(
     target.mesh.position,
     u.mesh.position
    );

   const distance=dir.length();

   if(c.ranged){

    if(distance<=c.range){

     if(now-u.last>=c.interval){

      u.last=now;

      createPeaProjectile(
       u,
       target,
       c.damage,
       team
      );
     }

    }else{

     dir.normalize();

     u.mesh.position.addScaledVector(
      dir,
      c.speed
     );

     u.mesh.rotation.y=
      Math.atan2(
       dir.x,
       dir.z
      );

     animateUnit(u.mesh,now);
    }

    continue;
   }

   if(distance>1.35){

    dir.normalize();

    u.mesh.position.addScaledVector(
     dir,
     c.speed
    );

    u.mesh.rotation.y=
     Math.atan2(
      dir.x,
      dir.z
     );

    animateUnit(u.mesh,now);

   }else{

    if(now-u.last>=c.interval){

     u.last=now;

     damageUnit(
      target,
      c.damage
     );
    }
   }

   continue;
  }

  const dir=new THREE.Vector3()
   .subVectors(
    brain.position,
    u.mesh.position
   );

  const distance=dir.length();

  if(c.ranged){

   if(distance<=c.range){

    if(now-u.last>=c.interval){

     u.last=now;

     createBrainProjectile(
      u,
      team,
      c.damage
     );
    }

   }else{

    dir.normalize();

    u.mesh.position.addScaledVector(
     dir,
     c.speed
    );

    u.mesh.rotation.y=
     Math.atan2(
      dir.x,
      dir.z
     );

    animateUnit(u.mesh,now);
   }

   continue;
  }

  if(distance>1.7){

   dir.normalize();

   u.mesh.position.addScaledVector(
    dir,
    c.speed
   );

   u.mesh.rotation.y=
    Math.atan2(
     dir.x,
     dir.z
    );

   animateUnit(u.mesh,now);

  }else{

   if(now-u.last>=c.interval){

    u.last=now;

    damageBrain(
     team,
     c.damage
    );
   }
  }
 }
}

  return true;

 });

/* =====================================================
   BATTLE UPDATE
===================================================== */

function battleUpdate(now){

 /* Bizim odun: saniyede +1 */
 if(now-lastMyWood>=1000){

  const n=Math.floor(
   (now-lastMyWood)/1000
  );

  lastMyWood+=n*1000;

  myWood=Math.min(
   10,
   myWood+n
  );
 }


 /*
  RAKİP ODUNU DAHA HIZLI:
  yaklaşık her 0.65 saniyede +1.
 */
 const enemyWoodInterval=
  Math.max(
   500,
   650-enemyLevel*30
  );

 if(now-lastEnemyWood>=enemyWoodInterval){

  const n=Math.floor(
   (now-lastEnemyWood)/
   enemyWoodInterval
  );

  lastEnemyWood+=
   n*enemyWoodInterval;

  enemyWood=Math.min(
   10,
   enemyWood+n
  );
 }

 bot(now);

 armyUpdate(
  now,
  myUnits,
  enemyUnits,
  enemy,
  "blue"
 );

 armyUpdate(
  now,
  enemyUnits,
  myUnits,
  player,
  "red"
 );

 updateProjectiles();

 cleanup();

 updateUI();

 if(enemyHP<=0){

  finish(true);

  return;
 }

 if(myHP<=0){

  finish(false);

  return;
 }
}

/* =====================================================
   CONTROLS
===================================================== */

function controls(){

 const joy=
  document.getElementById("joy");

 const knob=
  document.getElementById("knob");

 function setJoy(t){

  const r=
   joy.getBoundingClientRect();

  let x=
   t.clientX-
   (r.left+r.width/2);

  let y=
   t.clientY-
   (r.top+r.height/2);

  const max=37;

  const d=Math.hypot(x,y);

  if(d>max){

   x=x/d*max;
   y=y/d*max;
  }

  joyX=x/max;
  joyY=y/max;

  knob.style.left=37+x+"px";
  knob.style.top=37+y+"px";
 }

 joy.addEventListener(
  "touchstart",
  e=>{
   e.preventDefault();
   setJoy(e.touches[0]);
  },
  {passive:false}
 );

 joy.addEventListener(
  "touchmove",
  e=>{
   e.preventDefault();
   setJoy(e.touches[0]);
  },
  {passive:false}
 );

 joy.addEventListener(
  "touchend",
  e=>{
   e.preventDefault();

   joyX=0;
   joyY=0;

   knob.style.left="37px";
   knob.style.top="37px";
  },
  {passive:false}
 );

 let look=false;
 let lastX=0;

 renderer.domElement.addEventListener(
  "touchstart",
  e=>{

   if(e.touches.length!==1)return;

   /*
    Joystick alanına dokunulduysa kamera
    hareket etmesin.
   */
   const r=
    joy.getBoundingClientRect();

   const x=e.touches[0].clientX;
   const y=e.touches[0].clientY;

   if(
    x>=r.left&&
    x<=r.right&&
    y>=r.top&&
    y<=r.bottom
   )return;

   look=true;
   lastX=x;
  },
  {passive:true}
 );

 renderer.domElement.addEventListener(
  "touchmove",
  e=>{

   if(!look)return;

   const x=e.touches[0].clientX;

   /*
    Sağa sürükle = kamera sağa.
    Sola sürükle = kamera sola.
   */
   yaw-=(x-lastX)*.006;

   lastX=x;
  },
  {passive:true}
 );

 renderer.domElement.addEventListener(
  "touchend",
  ()=>{
   look=false;
  }
 );
}


/* =====================================================
   MOVEMENT
===================================================== */

function movement(){

 if(mode!=="lobby")return;

 const forward=new THREE.Vector3(
  -Math.sin(yaw),
  0,
  -Math.cos(yaw)
 );

 const right=new THREE.Vector3(
  Math.cos(yaw),
  0,
  -Math.sin(yaw)
 );

 const move=new THREE.Vector3();

 /*
  JOYSTICK:

  SAĞ  = SAĞ
  SOL  = SOL
  YUKARI = İLERİ
  AŞAĞI = GERİ
 */

 move.addScaledVector(
  right,
  joyX
 );

 move.addScaledVector(
  forward,
  -joyY
 );

 if(move.lengthSq()>.001){

  move.normalize();

  px+=move.x*.11;
  pz+=move.z*.11;

  player.rotation.y=
   Math.atan2(
    move.x,
    move.z
   );

  animateCharacter(
   player,
   performance.now()
  );
 }

 px=Math.max(
  -45,
  Math.min(45,px)
 );

 pz=Math.max(
  -70,
  Math.min(15,pz)
 );

 player.position.set(
  px,
  0,
  pz
 );

 camera.position.x=
  px+Math.sin(yaw)*7;

 camera.position.y=5;

 camera.position.z=
  pz+Math.cos(yaw)*7;

 camera.lookAt(
  px,
  1.4,
  pz
 );

 checkCards();

 /*
  Savaş alanı kapısına girince savaş başlar.
 */
 if(
  Math.hypot(
   px,
   pz+15
  )<3.5
 ){

  beginBattle();
 }
}


/* =====================================================
   KART BULMA
===================================================== */

function checkCards(){

 scene.children.forEach(o=>{

  if(
   !o.userData||
   !o.userData.cardId
  )return;

  const id=o.userData.cardId;

  if(found[id])return;

  const d=Math.hypot(
   px-o.position.x,
   pz-o.position.z
  );

  if(d<2.4){

   found[id]=true;

   if(!owned.includes(id))
    owned.push(id);

   o.visible=false;

   /*
    Yonca dahil artık isim
    doğrudan CARDS'tan geliyor.
   */
   const c=CARDS[id];

   msg(
    c.emoji+
    " "+
    c.name+
    " bulundu!"
   );
  }
 });
}


/* =====================================================
   KARAKTER YÜRÜME
===================================================== */

function animateCharacter(c,t){

 if(!c||!c.userData)return;

 const moving=
  Math.abs(joyX)+
  Math.abs(joyY)>.1;

 if(!moving){

  c.userData.leftLeg.rotation.x=0;
  c.userData.rightLeg.rotation.x=0;
  c.userData.leftArm.rotation.x=0;
  c.userData.rightArm.rotation.x=0;

  return;
 }

 const a=Math.sin(t*.008)*.45;

 c.userData.leftLeg.rotation.x=a;
 c.userData.rightLeg.rotation.x=-a;

 c.userData.leftArm.rotation.x=-a*.7;
 c.userData.rightArm.rotation.x=a*.7;
}


/* =====================================================
   ANA DÖNGÜ
===================================================== */

function animate(){

 requestAnimationFrame(animate);

 const now=performance.now();

 if(mode==="lobby")
  movement();

 if(mode==="battle"){

  battleUpdate(now);

  /*
   Beyinler savaş sırasında sabit.
  */
  camera.position.set(
   0,
   27,
   37
  );

  camera.lookAt(
   0,
   0,
   0
  );
 }

 renderer.render(
  scene,
  camera
 );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>
